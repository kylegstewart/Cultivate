name: Release

# Publish a new version: Actions > Release > Run workflow, choose patch, minor or major. Or from a terminal:
#   gh workflow run release.yml -f bump=minor
# The job bumps <Version>, moves CHANGELOG.md's "Unreleased" notes into the release, builds and self-tests the
# package, then pushes the release commit and tag together and publishes the GitHub release.
# Installed copies pick it up with `cultivate update` (the terminal UI also announces it).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Visual Studio MSBuild and the .NET Framework 4.7.1 targeting pack are needed by the self-test fixtures.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Bump the version and changelog
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'main') { throw 'Run releases from main.' }
          $version = ./scripts/new-version.ps1 -Bump '${{ inputs.bump }}' -NotesPath "$env:RUNNER_TEMP\notes.md"
          "VERSION=$version" >> $env:GITHUB_ENV
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release v$version"
          git tag "v$version"

      - name: Build and package
        shell: pwsh
        run: ./scripts/build.ps1 -Package -UpdateRepository '${{ github.repository }}'

      - name: Self-test the package
        shell: pwsh
        env:
          CULTIVATE_HOME: ${{ runner.temp }}\cultivate-home
        run: |
          ./artifacts/publish/install.ps1 -InstallDir "$env:RUNNER_TEMP\cultivate" -NoDesktopShortcut -NoPath
          & "$env:RUNNER_TEMP\cultivate\Cultivate.exe" self-test

      - name: Push the release commit and tag
        shell: pwsh
        run: git push --atomic origin HEAD:main "v$env:VERSION"

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | Where-Object Name -like "Cultivate-$env:VERSION-*" | ForEach-Object FullName)
          $notes = "$env:RUNNER_TEMP\notes.md"
          if ([IO.File]::ReadAllText($notes).Trim()) {
            gh release create "v$env:VERSION" @assets --title "Cultivate $env:VERSION" --notes-file $notes
          } else {
            gh release create "v$env:VERSION" @assets --title "Cultivate $env:VERSION" --generate-notes
          }
